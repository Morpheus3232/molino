<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mes Personal y Día Personal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="rgba(149,149,149,0.22)"/>
      <stop offset="1" stop-color="rgba(149,149,149,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="80" y="120" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" letter-spacing="8" fill="#959595" font-weight="700">NUMEROLOGÍA</text>
  <text x="80" y="290" font-family="'Arial Black',Arial,sans-serif" font-size="88" fill="#F1F1F1" font-weight="900">MES</text>
  <text x="80" y="380" font-family="'Arial Black',Arial,sans-serif" font-size="88" fill="#F1F1F1" font-weight="900">PERSONAL</text>
  <text x="80" y="460" font-family="'Arial Black',Arial,sans-serif" font-size="40" fill="#959595" font-weight="900">+ DÍA PERSONAL</text>
  <text x="82" y="530" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#AFAFAF">El zoom que le falta a tu Año Personal</text>
